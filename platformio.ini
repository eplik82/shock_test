; shock_test — Half-Sine Shock Pulse tester
; Waveshare ESP32-S3-Touch-LCD-4.3 (800x480 RGB, GT911, CH422G) + ADXL375 (I2C 0x53)

[platformio]
; ehitus WSL-i failisüsteemis (kiirem kui /mnt/c)
build_dir = ${sysenv.HOME}/.cache/shock_test/build

[env:shock]
; lukustatud versioon (ESP-IDF 5.5.5); "stable" viide liigub ja vahetab IDF-i
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.embed_files =
    fonts/DejaVuSans.ttf
    fonts/DejaVuSans-Bold.ttf
upload_speed = 921600
monitor_speed = 921600
