# Püsivara ehitus ja release
#   * push main-i / pull request -> kompileerimise kontroll
#   * silt v* (nt v0.2.0) -> GitHub release: firmware.bin (OTA portaali kaudu) + täispilt USB jaoks
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/#define FW_VERSION .*/#define FW_VERSION \"${GITHUB_REF_NAME#v}\"/" src/version.h

      - name: Build
        run: pio run -e shock

      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          B=$HOME/.cache/shock_test/build/shock
          cp $B/firmware.bin firmware.bin
          cp $B/firmware.factory.bin shock_test-factory.bin
          sha256sum firmware.bin shock_test-factory.bin > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            firmware.bin
            shock_test-factory.bin
            SHA256SUMS.txt
          generate_release_notes: true
